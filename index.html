<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Darts</title>
  <style>
    body { margin: 0; background: #0b0f1a; color: white; font-family: Arial, sans-serif; overflow: hidden; }
    #info { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; }
    #info h1 { color: #ff3b6b; margin: 0; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <h1>🎯 Reality Darts</h1>
    <p>Press START AR to begin</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    // ---------- STAGE 1: SCENE + PASSTHROUGH ----------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
    camera.position.set(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(ARButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking', 'plane-detection']
    }));

    renderer.xr.addEventListener('sessionstart', () => {
      document.getElementById('info').style.display = 'none';
      showMenu('intro'); // Stage 6: start with How to Play
    });

    function makeTarget() {
      const target = new THREE.Group();
      const rings = [
        { radius: 0.25, color: 0x2f7bff },
        { radius: 0.15, color: 0xffd23f },
        { radius: 0.06, color: 0xff2d55 }
      ];
      rings.forEach((ring, i) => {
        const mesh = new THREE.Mesh(
          new THREE.CircleGeometry(ring.radius, 48),
          new THREE.MeshBasicMaterial({ color: ring.color })
        );
        mesh.position.z = i * 0.002;
        target.add(mesh);
      });
      return target;
    }

    const target = makeTarget();
    target.position.set(0, 1.2, -1.5);
    scene.add(target);

    // ---------- STAGE 2: GAZE ----------
    const target2 = makeTarget();
    target2.position.set(-0.8, 1.0, -1.6);
    scene.add(target2);

    const targets = [target, target2];
    let gazedTarget = null;
    const gazePoint = new THREE.Vector3(); // the exact spot on the target your dot is touching

    const gazeDot = new THREE.Mesh(
      new THREE.RingGeometry(0.008, 0.013, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true })
    );
    gazeDot.position.set(0, 0, -1);
    gazeDot.renderOrder = 999;
    gazeDot.onBeforeRender = () => gazeDot.updateMatrixWorld();
    camera.add(gazeDot);
    scene.add(camera);

    const raycaster = new THREE.Raycaster();
    const eyePos = new THREE.Vector3();
    const eyeDir = new THREE.Vector3();
    const bigSize = new THREE.Vector3(1.12, 1.12, 1.12);
    const normalSize = new THREE.Vector3(1, 1, 1);

    function updateGaze() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(eyeDir);
      raycaster.set(eyePos, eyeDir);

      const hits = raycaster.intersectObjects(targets.filter(t => t.visible), true);
      let found = null;
      if (hits.length > 0) {
        found = hits[0].object;
        gazePoint.copy(hits[0].point);
        while (found.parent && !targets.includes(found)) found = found.parent;
      }
      gazedTarget = found;

      targets.forEach(t => {
        t.scale.lerp(t === gazedTarget ? bigSize : normalSize, 0.15);
      });

      gazeDot.material.color.set(gazedTarget ? 0x39ff88 : 0xffffff);
    }

    // ---------- STAGE 3: HANDS + PINCH TO HOLD ----------
    // Build a simple dart: silver tip, white body, pink flights. It points forward (+Z).
    function makeDart() {
      const dart = new THREE.Group();
      const mat = (color) => new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide });

      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.006, 0.03, 12), mat(0xcccccc));
      tip.rotation.x = Math.PI / 2;
      tip.position.z = 0.075;

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.1, 12), mat(0xffffff));
      body.rotation.x = Math.PI / 2;
      body.position.z = 0.01;

      const flight1 = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 0.035), mat(0xff3b6b));
      flight1.rotation.y = Math.PI / 2;
      flight1.position.z = -0.03;

      const flight2 = new THREE.Mesh(new THREE.PlaneGeometry(0.035, 0.04), mat(0xff3b6b));
      flight2.rotation.x = Math.PI / 2;
      flight2.position.z = -0.03;

      dart.add(tip, body, flight1, flight2);
      return dart;
    }

    const dart = makeDart();
    dart.visible = false;
    scene.add(dart);

    let dartState = 'ready'; // 'ready' = floating near your hand, 'held' = pinched
    let heldBy = null;       // which hand is holding it

    // See-through when ready, solid when held
    function setDartSolid(solid) {
      dart.traverse(o => { if (o.material) o.material.opacity = solid ? 1 : 0.45; });
    }
    setDartSolid(false);

    function grabDart(info) {
      dartState = 'held';
      heldBy = info;
      setDartSolid(true);
    }

    // Letting go of the pinch = try to throw (see Stage 4)
    function releaseDart() {
      heldBy = null;
      throwDart(getHandVelocity());
      handSamples.length = 0;
    }

    // Hand disappeared while holding: put the dart back, no throw
    function cancelDart() {
      dartState = 'ready';
      heldBy = null;
      handSamples.length = 0;
      setDartSolid(false);
    }

    // Set up both hands. A pinch sends "selectstart"; letting go sends "selectend".
    const handFactory = new XRHandModelFactory();
    const hands = [];
    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      const hand = renderer.xr.getHand(i);
      hand.add(handFactory.createHandModel(hand, 'spheres')); // little balls on your finger joints
      scene.add(controller);
      scene.add(hand);

      const info = { controller, hand, handedness: null, connected: false, isHand: false };
      hands.push(info);

      controller.addEventListener('connected', (e) => {
        info.connected = true;
        info.handedness = e.data.handedness; // 'left' or 'right'
        info.isHand = !!e.data.hand;         // true = real hand, false = controller
      });
      controller.addEventListener('disconnected', () => {
        info.connected = false;
        if (heldBy === info) cancelDart();
      });
      controller.addEventListener('selectstart', () => {
        if (gazedButton) { pressButton(gazedButton); return; } // Stage 6: menu buttons first
        if (dartState === 'ready' && canThrow()) grabDart(info);
      });
      controller.addEventListener('selectend', () => {
        if (heldBy === info) releaseDart();
      });
    }

    // Find the point between your thumb tip and index finger tip
    const tipA = new THREE.Vector3();
    const tipB = new THREE.Vector3();
    function getPinchPoint(info, out) {
      const index = info.hand.joints['index-finger-tip'];
      const thumb = info.hand.joints['thumb-tip'];
      if (info.isHand && index && thumb && index.visible) {
        index.getWorldPosition(tipA);
        thumb.getWorldPosition(tipB);
        return out.copy(tipA).add(tipB).multiplyScalar(0.5);
      }
      return info.controller.getWorldPosition(out); // backup if using controllers
    }

    // The ready dart shows on your right hand (or whichever hand is visible)
    function getDartHand() {
      const visible = hands.filter(h => h.connected);
      return visible.find(h => h.handedness === 'right') || visible[0] || null;
    }

    const pinchPos = new THREE.Vector3();
    const aimPoint = new THREE.Vector3();
    function updateDart(dt) {
      if (dartState === 'flying') { updateFlight(dt); return; }
      if (!canThrow() && dartState !== 'held') { dart.visible = false; return; } // no dart during menus

      const info = (dartState === 'held') ? heldBy : getDartHand();
      if (!info) { dart.visible = false; return; }
      dart.visible = true;

      getPinchPoint(info, pinchPos);
      if (dartState === 'ready') pinchPos.y += 0.05; // float just above your fingers
      dart.position.copy(pinchPos);

      // While holding, remember where the hand was (used to measure the flick)
      if (dartState === 'held') recordHandSample(pinchPos);

      // Point the dart at the target you're looking at, or straight ahead
      if (gazedTarget) {
        aimPoint.copy(gazePoint);
      } else {
        camera.getWorldDirection(aimPoint);
        aimPoint.multiplyScalar(2).add(eyePos);
      }
      dart.lookAt(aimPoint);
    }

    // ---------- STAGE 4: FLICK TO THROW ----------
    // Settings you can tweak later on the real headset:
    const TEST_MODE = true;      // true = emulator test: any release throws. Set to false on the real Quest.
    const MIN_FLICK_SPEED = 0.8; // how fast (metres/second) your hand must move to count as a throw
    const GRAVITY = 4.0;         // gentle gravity (real life is 9.8) so throws feel forgiving
    const AIM_ASSIST = 0.75;     // 0 = only your hand direction, 1 = straight at the target you look at

    const handSamples = [];      // hand positions from the last 0.1 seconds
    const dartVel = new THREE.Vector3(); // dart speed + direction while flying
    let flightTime = 0;
    let throwStartY = 0;

    function recordHandSample(pos) {
      const now = performance.now();
      handSamples.push({ p: pos.clone(), t: now });
      while (handSamples.length > 2 && now - handSamples[0].t > 100) handSamples.shift();
    }

    // Hand speed = how far the hand moved, divided by how long it took
    function getHandVelocity() {
      if (handSamples.length < 2) return new THREE.Vector3();
      const first = handSamples[0];
      const last = handSamples[handSamples.length - 1];
      const seconds = (last.t - first.t) / 1000;
      if (seconds <= 0) return new THREE.Vector3();
      return last.p.clone().sub(first.p).divideScalar(seconds);
    }

    function throwDart(handVel) {
      let handSpeed = handVel.length();

      if (handSpeed < MIN_FLICK_SPEED) {
        if (!TEST_MODE) { cancelDart(); return; } // gentle let-go = no throw
        handSpeed = 1.5;            // emulator: pretend you flicked
        handVel.copy(eyeDir);       // ...in the direction you're looking
      }

      // Turn a small hand flick into a satisfying dart speed (3 to 9 m/s)
      const dartSpeed = THREE.MathUtils.clamp(handSpeed * 3, 3, 9);
      const dir = handVel.clone().normalize();

      if (gazedTarget) {
        // Aim assist: bend the throw toward the target you're looking at
        // Aim at the exact spot under your gaze dot (not just the target's centre)
        const toTarget = gazePoint.clone().sub(dart.position);
        const distance = toTarget.length();
        const assist = TEST_MODE ? 1 : AIM_ASSIST; // emulator: perfect aim, so you can test each ring
        dir.lerp(toTarget.normalize(), assist).normalize();
        dartVel.copy(dir).multiplyScalar(dartSpeed);
        // Aim a little higher so gravity drops the dart onto the target
        dartVel.y += 0.5 * GRAVITY * (distance / dartSpeed);
      } else {
        dartVel.copy(dir).multiplyScalar(dartSpeed);
      }

      dartState = 'flying';
      flightTime = 0;
      throwStartY = dart.position.y;
      setDartSolid(true);
    }

    // Move the flying dart a little each frame
    function updateFlight(dt) {
      flightTime += dt;
      dartVel.y -= GRAVITY * dt;                 // gravity pulls it down

      // STAGE 5: before moving, check if the dart's path crosses a target this frame
      if (checkTargetHit(dt)) return;

      dart.position.addScaledVector(dartVel, dt); // move it
      aimPoint.copy(dart.position).add(dartVel);
      dart.lookAt(aimPoint);                      // nose points where it's going

      // After 2 seconds, or if it drops 1.5 m below where it was thrown, it's a miss
      if (flightTime > 2 || dart.position.y < throwStartY - 1.5) {
        showPopup('MISS', '#ffffff', dart.position);
        resetDart();
        onThrowResult(0);
      }
    }

    function resetDart() {
      dartState = 'ready';
      setDartSolid(false);
    }

    // ---------- STAGE 5: HITTING + STICKING ----------
    const DART_TIP = 0.09;          // distance from the dart's middle to its tip (metres)
    const MAX_STUCK = 10;           // how many darts can stay stuck at once
    const stuckDarts = [];
    const hitRay = new THREE.Raycaster();
    const moveDir = new THREE.Vector3();
    const localHit = new THREE.Vector3();

    // Ring sizes match makeTarget(): red 0.06, yellow 0.15, blue 0.25
    function ringScore(distanceFromCentre) {
      if (distanceFromCentre <= 0.06) return { points: 100, text: 'BULLSEYE! +100', color: '#ff2d55' };
      if (distanceFromCentre <= 0.15) return { points: 50,  text: '+50',            color: '#ffd23f' };
      if (distanceFromCentre <= 0.25) return { points: 20,  text: '+20',            color: '#2f7bff' };
      return null;
    }

    function checkTargetHit(dt) {
      // Shoot a short invisible line from the dart forward, as long as this frame's move + the tip
      moveDir.copy(dartVel).normalize();
      hitRay.set(dart.position, moveDir);
      hitRay.far = dartVel.length() * dt + DART_TIP;

      const hits = hitRay.intersectObjects(targets, true)
        .filter(h => !h.object.userData.isStuckDart);   // ignore darts already stuck there
      if (hits.length === 0) return false;

      const hit = hits[0];
      let hitTarget = hit.object;
      while (hitTarget.parent && !targets.includes(hitTarget)) hitTarget = hitTarget.parent;

      // How far from the centre did it land? (measured on the target itself)
      localHit.copy(hit.point);
      hitTarget.worldToLocal(localHit);
      const result = ringScore(Math.hypot(localHit.x, localHit.y));
      if (!result) return false;   // touched the edge only, keep flying

      // Put the dart so its tip sinks slightly into the board
      dart.position.copy(hit.point).addScaledVector(moveDir, -(DART_TIP - 0.015));
      aimPoint.copy(hit.point).add(moveDir);
      dart.lookAt(aimPoint);

      stickCopy(hitTarget);
      showPopup(result.text, result.color, hit.point);
      resetDart();
      onThrowResult(result.points);   // Stage 6: add to the score
      return true;
    }

    // Leave a solid copy of the dart stuck in the target; the real dart returns to your hand
    function stickCopy(hitTarget) {
      const copy = dart.clone(true);
      copy.traverse(o => {
        o.userData.isStuckDart = true;
        if (o.material) { o.material = o.material.clone(); o.material.opacity = 1; }
      });
      hitTarget.attach(copy);   // becomes part of the target, so it moves with it later
      stuckDarts.push(copy);
      if (stuckDarts.length > MAX_STUCK) {
        const oldest = stuckDarts.shift();
        oldest.parent.remove(oldest);
      }
    }

    // Floating score text that rises and fades out
    const popups = [];
    function showPopup(text, color, position) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold 72px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#000000';
      ctx.strokeText(text, 256, 64);
      ctx.fillStyle = color;
      ctx.fillText(text, 256, 64);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false
      }));
      sprite.scale.set(0.4, 0.1, 1);
      sprite.position.copy(position);
      sprite.position.y += 0.15;
      sprite.renderOrder = 998;
      scene.add(sprite);
      popups.push({ sprite, age: 0 });
    }

    function updatePopups(dt) {
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.age += dt;
        p.sprite.position.y += 0.15 * dt;              // float up
        p.sprite.material.opacity = 1 - p.age / 1.2;   // fade out
        if (p.age > 1.2) {
          scene.remove(p.sprite);
          p.sprite.material.map.dispose();
          p.sprite.material.dispose();
          popups.splice(i, 1);
        }
      }
    }

    // ---------- STAGE 6: SCORING, MENUS + HUD ----------
    const PRACTICE_DARTS = 3;
    const ROUND_DARTS = 10;

    // mode: 'intro' | 'practice' | 'practiceDone' | 'round' | 'results'
    const game = { mode: 'intro', thrown: 0, score: 0, hits: 0, best: 0, streak: 0, bestStreak: 0, waiting: false };

    // Hand-tracking check: is at least one hand (or controller) being seen right now?
    function handsVisible() {
      return hands.some(h => {
        if (!h.connected) return false;
        if (!h.isHand) return true;
        const wrist = h.hand.joints['wrist'];
        return !!(wrist && wrist.visible);
      });
    }

    function isPlaying() { return game.mode === 'practice' || game.mode === 'round'; }
    function canThrow() { return isPlaying() && !game.waiting && handsVisible(); }

    // Helper: a flat rectangle we can draw text on (like a little screen)
    function makeCanvasPlane(width, height, pxW, pxH) {
      const canvas = document.createElement('canvas');
      canvas.width = pxW; canvas.height = pxH;
      const texture = new THREE.CanvasTexture(canvas);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false })
      );
      mesh.renderOrder = 990;
      return { mesh, canvas, ctx: canvas.getContext('2d'), texture };
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ----- Menu panel (How to Play, Practice done, Results) -----
    const menu = new THREE.Group();
    const menuPanel = makeCanvasPlane(0.9, 0.6, 900, 600);
    const menuButton = makeCanvasPlane(0.4, 0.1, 400, 100);
    menuButton.mesh.position.set(0, -0.2, 0.01);
    menuButton.mesh.renderOrder = 991;
    menu.add(menuPanel.mesh, menuButton.mesh);
    menu.visible = false;
    scene.add(menu);

    const buttons = [menuButton.mesh];
    let gazedButton = null;
    let menuPlaceFrames = 0;   // wait a few frames so we know where your head is

    function drawMenu(title, lines, buttonText) {
      const c = menuPanel.ctx;
      c.clearRect(0, 0, 900, 600);
      roundRect(c, 10, 10, 880, 580, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.88)'; c.fill();
      c.lineWidth = 6; c.strokeStyle = '#ff3b6b'; c.stroke();

      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = '#ff3b6b'; c.font = 'bold 64px Arial';
      c.fillText(title, 450, 80);
      c.fillStyle = '#ffffff'; c.font = '40px Arial';
      lines.forEach((line, i) => c.fillText(line, 450, 170 + i * 56));
      menuPanel.texture.needsUpdate = true;

      const b = menuButton.ctx;
      b.clearRect(0, 0, 400, 100);
      roundRect(b, 4, 4, 392, 92, 46);
      b.fillStyle = '#39ff88'; b.fill();
      b.fillStyle = '#0b0f1a'; b.font = 'bold 40px Arial';
      b.textAlign = 'center'; b.textBaseline = 'middle';
      b.fillText(buttonText, 200, 52);
      menuButton.texture.needsUpdate = true;
    }

    function showMenu(which) {
      game.mode = which;
      game.waiting = false;
      if (which === 'intro') {
        drawMenu('HOW TO PLAY', [
          '1. Look at a target.',
          '2. Pinch to hold a dart.',
          '3. Flick your hand to throw.',
          '4. Hit the center for more points.',
          'Look at the button + pinch to start'
        ], 'START PRACTICE');
        menuButton.mesh.userData.action = 'startPractice';
      } else if (which === 'practiceDone') {
        drawMenu('PRACTICE DONE!', [
          'Now the real round: ' + ROUND_DARTS + ' darts.',
          'Red centre = 100',
          'Yellow = 50   Blue = 20'
        ], 'START ROUND');
        menuButton.mesh.userData.action = 'startRound';
      } else if (which === 'results') {
        const accuracy = Math.round((game.hits / ROUND_DARTS) * 100);
        drawMenu('ROUND COMPLETE', [
          'Total score: ' + game.score,
          'Best throw: ' + game.best,
          'Accuracy: ' + accuracy + '%',
          'Best streak: ' + game.bestStreak
        ], 'PLAY AGAIN');
        menuButton.mesh.userData.action = 'startRound';
      }
      menu.visible = true;
      menuPlaceFrames = 3;
      targets.forEach(t => t.visible = false);
      hud.mesh.visible = false;
    }

    function hideMenu() {
      menu.visible = false;
      gazedButton = null;
      targets.forEach(t => t.visible = true);
      hud.mesh.visible = true;
    }

    // Put the menu 1 metre in front of where you're facing (ignores looking up/down)
    const flatDir = new THREE.Vector3();
    function placeMenu() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(flatDir);
      flatDir.y = 0;
      if (flatDir.lengthSq() < 0.001) flatDir.set(0, 0, -1);
      flatDir.normalize();
      menu.position.copy(eyePos).addScaledVector(flatDir, 1.0);
      menu.position.y = eyePos.y - 0.05;
      menu.lookAt(eyePos.x, menu.position.y, eyePos.z);
    }

    function pressButton(button) {
      const action = button.userData.action;
      hideMenu();
      if (action === 'startPractice') startPractice();
      if (action === 'startRound') startRound();
    }

    function clearStuckDarts() {
      stuckDarts.forEach(d => d.parent && d.parent.remove(d));
      stuckDarts.length = 0;
    }

    function resetStats() {
      Object.assign(game, { thrown: 0, score: 0, hits: 0, best: 0, streak: 0, bestStreak: 0, waiting: false });
    }

    // Place targets in front of wherever you're facing, at a comfortable seated height
    // (right: forward, up, left-right). Stage 7 will use real surfaces instead.
    const TARGET_LAYOUT = [
      { forward: 1.5, up: -0.1, side: 0 },
      { forward: 1.6, up: -0.3, side: -0.8 }
    ];
    const sideDir = new THREE.Vector3();
    function placeTargetsInFront() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(flatDir);
      flatDir.y = 0;
      if (flatDir.lengthSq() < 0.001) flatDir.set(0, 0, -1);
      flatDir.normalize();
      sideDir.set(-flatDir.z, 0, flatDir.x); // points to your right
      targets.forEach((t, i) => {
        const L = TARGET_LAYOUT[i];
        t.position.copy(eyePos)
          .addScaledVector(flatDir, L.forward)
          .addScaledVector(sideDir, L.side);
        t.position.y = eyePos.y + L.up;
        t.lookAt(eyePos);  // face the player
      });
    }

    function startPractice() {
      clearStuckDarts(); resetStats();
      placeTargetsInFront();
      game.mode = 'practice';
      drawHud();
    }

    function startRound() {
      clearStuckDarts(); resetStats();
      placeTargetsInFront();
      game.mode = 'round';
      drawHud();
    }

    // Called once after every throw (hit = points, miss = 0)
    function onThrowResult(points) {
      if (!isPlaying()) return;
      game.thrown++;

      if (game.mode === 'round') {
        game.score += points;
        game.best = Math.max(game.best, points);
        if (points > 0) {
          game.hits++;
          game.streak++;
          game.bestStreak = Math.max(game.bestStreak, game.streak);
        } else {
          game.streak = 0;
        }
      }
      drawHud();

      const total = game.mode === 'practice' ? PRACTICE_DARTS : ROUND_DARTS;
      if (game.thrown >= total) {
        game.waiting = true; // short pause so you can see your last score popup
        const next = game.mode === 'practice' ? 'practiceDone' : 'results';
        setTimeout(() => showMenu(next), 1500);
      }
    }

    // ----- HUD: small score bar fixed near the bottom of your view -----
    const hud = makeCanvasPlane(0.6, 0.12, 1000, 200);
    hud.mesh.position.set(0, -0.32, -1);
    hud.mesh.onBeforeRender = () => hud.mesh.updateMatrixWorld();
    hud.mesh.visible = false;
    camera.add(hud.mesh);

    function drawHud() {
      const c = hud.ctx;
      const total = game.mode === 'practice' ? PRACTICE_DARTS : ROUND_DARTS;
      c.clearRect(0, 0, 1000, 200);
      roundRect(c, 10, 10, 980, 180, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.7)'; c.fill();

      c.textBaseline = 'middle'; c.textAlign = 'left';
      c.fillStyle = '#ff3b6b'; c.font = 'bold 48px Arial';
      c.fillText(game.mode === 'practice' ? 'PRACTICE' : 'SCORE ' + game.score, 40, 70);
      c.textAlign = 'right'; c.fillStyle = '#ffffff'; c.font = '44px Arial';
      c.fillText('Dart ' + Math.min(game.thrown + 1, total) + ' / ' + total, 960, 70);

      // Progress bar: one block per dart
      const gap = 10, barW = 920, w = (barW - gap * (total - 1)) / total;
      for (let i = 0; i < total; i++) {
        c.fillStyle = i < game.thrown ? '#39ff88' : 'rgba(255,255,255,0.25)';
        roundRect(c, 40 + i * (w + gap), 125, w, 36, 10);
        c.fill();
      }
      hud.texture.needsUpdate = true;
    }

    // ----- "Hands not detected" message -----
    const handsMsg = makeCanvasPlane(0.6, 0.12, 1000, 200);
    handsMsg.mesh.position.set(0, 0.08, -1);
    handsMsg.mesh.onBeforeRender = () => handsMsg.mesh.updateMatrixWorld();
    handsMsg.mesh.visible = false;
    camera.add(handsMsg.mesh);
    (() => {
      const c = handsMsg.ctx;
      roundRect(c, 10, 10, 980, 180, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.85)'; c.fill();
      c.lineWidth = 6; c.strokeStyle = '#ffd23f'; c.stroke();
      c.fillStyle = '#ffffff'; c.font = 'bold 44px Arial';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('Hands not detected.', 500, 70);
      c.fillText('Bring your hands into view.', 500, 130);
      handsMsg.texture.needsUpdate = true;
    })();

    // Runs every frame: menu placement, button gaze, hands message
    const buttonScaleBig = new THREE.Vector3(1.08, 1.08, 1);
    function updateUI() {
      if (menu.visible && menuPlaceFrames > 0) {
        menuPlaceFrames--;
        placeMenu();
      }

      gazedButton = null;
      if (menu.visible) {
        const hits = raycaster.intersectObjects(buttons, false);
        if (hits.length > 0) gazedButton = hits[0].object;
      }
      buttons.forEach(b => b.scale.lerp(b === gazedButton ? buttonScaleBig : normalSize, 0.2));
      if (gazedButton) gazeDot.material.color.set(0x39ff88);

      handsMsg.mesh.visible = renderer.xr.isPresenting && isPlaying() && !handsVisible();
    }

    // ---------- WINDOW RESIZE ----------
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- GAME LOOP (runs every frame) ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05); // seconds since last frame
      updateGaze();
      updateUI();
      updateDart(dt);
      updatePopups(dt);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
