<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Darts</title>
  <style>
    body { margin: 0; background: #0b0f1a; color: white; font-family: Arial, sans-serif; overflow: hidden; }
    #info { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; }
    #info h1 { color: #ff3b6b; margin: 0; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <h1>🎯 Reality Darts</h1>
    <p>Press START AR to begin</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ---------- STAGE 1: SCENE + PASSTHROUGH ----------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
    camera.position.set(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(ARButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking', 'plane-detection']
    }));

    renderer.xr.addEventListener('sessionstart', () => {
      document.getElementById('info').style.display = 'none';
      initAudio(); // Stage 9: sound + music
      showMenu('intro'); // Stage 6: start with How to Play
    });

    // A round soft-glow picture made once and shared by all targets
    const glowMaterial = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(64, 64, 30, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 90, 160, 0.55)');
      grad.addColorStop(1, 'rgba(255, 90, 160, 0)');
      g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
      return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false });
    })();

    function makeTarget() {
      const target = new THREE.Group();
      const rings = [
        { radius: 0.25, color: 0x2f7bff },
        { radius: 0.15, color: 0xffd23f },
        { radius: 0.06, color: 0xff2d55 }
      ];
      // Stage 9: soft neon glow behind the board (not hittable)
      const glow = new THREE.Mesh(new THREE.CircleGeometry(0.36, 48), glowMaterial);
      glow.position.z = -0.003;
      glow.raycast = () => {};
      glow.userData.isGlow = true;
      target.add(glow);
      rings.forEach((ring, i) => {
        const mesh = new THREE.Mesh(
          new THREE.CircleGeometry(ring.radius, 48),
          new THREE.MeshBasicMaterial({ color: ring.color })
        );
        mesh.position.z = i * 0.002;
        target.add(mesh);
      });
      return target;
    }

    // ---------- STAGE 2: GAZE ----------
    const targets = []; // filled in Stage 7
    let gazedTarget = null;
    const gazePoint = new THREE.Vector3(); // the exact spot on the target your dot is touching

    const gazeDot = new THREE.Mesh(
      new THREE.RingGeometry(0.008, 0.013, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true })
    );
    gazeDot.position.set(0, 0, -1);
    gazeDot.renderOrder = 999;
    gazeDot.onBeforeRender = () => gazeDot.updateMatrixWorld();
    camera.add(gazeDot);
    scene.add(camera);

    const raycaster = new THREE.Raycaster();
    const eyePos = new THREE.Vector3();
    const eyeDir = new THREE.Vector3();
    const bigSize = new THREE.Vector3(1.12, 1.12, 1.12);
    const normalSize = new THREE.Vector3(1, 1, 1);

    function updateGaze() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(eyeDir);
      raycaster.set(eyePos, eyeDir);

      const hits = raycaster.intersectObjects(targets.filter(t => t.visible), true);
      let found = null;
      if (hits.length > 0) {
        found = hits[0].object;
        gazePoint.copy(hits[0].point);
        while (found.parent && !targets.includes(found)) found = found.parent;
      }
      gazedTarget = found;

      targets.forEach(t => {
        const base = t.userData.baseScale || 1;
        const goal = (t === gazedTarget ? 1.12 : 1) * base;
        t.scale.lerp(bigSize.set(goal, goal, goal), 0.15);
      });

      gazeDot.material.color.set(gazedTarget ? 0x39ff88 : 0xffffff);
    }

    // ---------- STAGE 3: HANDS + PINCH TO HOLD ----------
    // Build a simple dart: silver tip, white body, pink flights. It points forward (+Z).
    // Soft studio reflections so metal parts (dart barrel, point) shine like real metal
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // A realistic steel-tip dart, about 15.6 cm long like a real one. Points forward (+Z).
    // Tip at z = +0.09, flights end at z = -0.066.
    const DART_GRIP = 0.033;   // middle of the barrel: where your fingers hold it
    function makeDart() {
      const dart = new THREE.Group();
      const steel = new THREE.MeshStandardMaterial({ color: 0xd8dde3, metalness: 1, roughness: 0.22, transparent: true });
      const tungsten = new THREE.MeshStandardMaterial({ color: 0x8a8f96, metalness: 1, roughness: 0.38, transparent: true });
      const shaftMat = new THREE.MeshStandardMaterial({ color: 0x15171c, metalness: 0.2, roughness: 0.28, transparent: true });
      const ringMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 1, roughness: 0.3, transparent: true });
      // Lathe shapes are drawn around the Y axis; this turns them to point along +Z
      const lathe = (pts, material) => {
        const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 20), material);
        m.rotation.x = Math.PI / 2;
        return m;
      };

      // Steel point: thin rod ending in a sharp tip
      const point = lathe([[0, 0.09], [0.0006, 0.088], [0.0012, 0.083], [0.0013, 0.06], [0.0016, 0.058], [0, 0.058]], steel);

      // Tungsten barrel with grip grooves (the part your fingers hold)
      const barrelPts = [[0, 0.058], [0.0022, 0.058], [0.0034, 0.054]];
      for (let z = 0.050; z > 0.016; z -= 0.004) {
        barrelPts.push([0.0036, z + 0.0012], [0.0031, z], [0.0036, z - 0.0012]);   // one groove
      }
      barrelPts.push([0.0034, 0.012], [0.0026, 0.008], [0, 0.008]);
      const barrel = lathe(barrelPts, tungsten);

      // Shaft (stem) and a small gold ring
      const shaft = lathe([[0, 0.008], [0.0021, 0.008], [0.0018, -0.028], [0.0022, -0.031], [0, -0.031]], shaftMat);
      const ring = lathe([[0, 0.0095], [0.0026, 0.0095], [0.0026, 0.0075], [0, 0.0075]], ringMat);

      // Four flights (wings) with a neon pink print and a white edge
      const flightCanvas = document.createElement('canvas');
      flightCanvas.width = 64; flightCanvas.height = 128;
      const fc = flightCanvas.getContext('2d');
      const grad = fc.createLinearGradient(0, 0, 64, 128);
      grad.addColorStop(0, '#ff3b6b'); grad.addColorStop(1, '#b0124a');
      fc.fillStyle = grad; fc.fillRect(0, 0, 64, 128);
      fc.strokeStyle = '#ffffff'; fc.lineWidth = 8; fc.strokeRect(0, 0, 64, 128);
      const flightTex = new THREE.CanvasTexture(flightCanvas);
      flightTex.colorSpace = THREE.SRGBColorSpace;
      const flightMat = new THREE.MeshStandardMaterial({ map: flightTex, roughness: 0.45, metalness: 0, side: THREE.DoubleSide, transparent: true });
      // Flight outline: x = distance from the stem, y = along the dart
      const shape = new THREE.Shape();
      shape.moveTo(0, -0.028);
      shape.lineTo(0.005, -0.028);
      shape.lineTo(0.018, -0.050);
      shape.lineTo(0.018, -0.066);
      shape.lineTo(0, -0.066);
      shape.closePath();
      const flightGeo = new THREE.ShapeGeometry(shape);
      // Map the print over the flight
      const uv = flightGeo.attributes.uv, pos = flightGeo.attributes.position;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / 0.018, (pos.getY(i) + 0.066) / 0.038);
      for (let k = 0; k < 4; k++) {
        const wing = new THREE.Mesh(flightGeo, flightMat);
        // Turn the flat shape so "y" runs along the dart (+Z) and "x" sticks out from the stem
        wing.rotation.x = Math.PI / 2;
        const holder = new THREE.Group();
        holder.rotation.z = k * Math.PI / 2;
        holder.add(wing);
        dart.add(holder);
      }

      dart.add(point, barrel, shaft, ring);
      return dart;
    }

    const dart = makeDart();
    dart.visible = false;
    scene.add(dart);

    let dartState = 'ready'; // 'ready' = floating near your hand, 'held' = pinched
    let heldBy = null;       // which hand is holding it

    // See-through when ready, solid when held
    function setDartSolid(solid) {
      dart.traverse(o => { if (o.material) o.material.opacity = solid ? 1 : 0.45; });
    }
    setDartSolid(false);

    function grabDart(info) {
      dartState = 'held';
      heldBy = info;
      setDartSolid(true);
    }

    // Letting go of the pinch = try to throw (see Stage 4)
    function releaseDart() {
      heldBy = null;
      throwDart(getHandVelocity());
      handSamples.length = 0;
    }

    // Hand disappeared while holding: put the dart back, no throw
    function cancelDart() {
      dartState = 'ready';
      heldBy = null;
      handSamples.length = 0;
      setDartSolid(false);
    }

    // Set up both hands. A pinch sends "selectstart"; letting go sends "selectend".
    const handFactory = new XRHandModelFactory();
    // Realistic hand model, loaded from the free WebXR Input Profiles library
    handFactory.setPath('https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles/generic-hand/');

    // Soft lights so the hand model looks 3D (everything else in the game glows on its own)
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 2.2));
    const handLight = new THREE.DirectionalLight(0xffffff, 1.6);
    handLight.position.set(0.5, 2, 1);
    scene.add(handLight);

    // Once a hand model has loaded, make it slightly see-through so that on the
    // Quest your real hands (seen through passthrough) still show underneath
    const SKIN_TONE = 0xc68863;   // change this colour to match your own hands in the video
    function styleHands() {
      hands.forEach(h => h.hand.traverse(o => {
        if (o.isMesh && !o.userData.styled) {
          o.userData.styled = true;
          if (!TEST_MODE) {
            // Real headset: hide the virtual hands so your own real hands,
            // seen through passthrough, pick up and throw the dart
            o.visible = false;
            return;
          }
          // PC emulator / video: a realistic skin-shaded hand
          o.material = new THREE.MeshPhysicalMaterial({
            color: SKIN_TONE, roughness: 0.55, metalness: 0,
            sheen: 0.6, sheenColor: 0xffc9b0, sheenRoughness: 0.6,
            clearcoat: 0.08, clearcoatRoughness: 0.6
          });
        }
      }));
    }
    const hands = [];
    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      const hand = renderer.xr.getHand(i);
      hand.add(handFactory.createHandModel(hand, 'mesh')); // realistic hand that follows your fingers
      scene.add(controller);
      scene.add(hand);

      const info = { controller, hand, handedness: null, connected: false, isHand: false };
      hands.push(info);

      controller.addEventListener('connected', (e) => {
        info.connected = true;
        info.handedness = e.data.handedness; // 'left' or 'right'
        info.isHand = !!e.data.hand;         // true = real hand, false = controller
      });
      controller.addEventListener('disconnected', () => {
        info.connected = false;
        if (heldBy === info) cancelDart();
      });
      controller.addEventListener('selectstart', () => {
        if (gazedButton) { pressButton(gazedButton); return; } // Stage 6: menu buttons first
        if (dartState === 'ready' && canThrow()) grabDart(info);
      });
      controller.addEventListener('selectend', () => {
        if (heldBy === info) releaseDart();
      });
    }

    // Find the point between your thumb tip and index finger tip
    const tipA = new THREE.Vector3();
    const tipB = new THREE.Vector3();
    function getPinchPoint(info, out) {
      const index = info.hand.joints['index-finger-tip'];
      const thumb = info.hand.joints['thumb-tip'];
      if (info.isHand && index && thumb && index.visible) {
        index.getWorldPosition(tipA);
        thumb.getWorldPosition(tipB);
        return out.copy(tipA).add(tipB).multiplyScalar(0.5);
      }
      return info.controller.getWorldPosition(out); // backup if using controllers
    }

    // The ready dart shows on your right hand (or whichever hand is visible)
    function getDartHand() {
      const visible = hands.filter(h => h.connected);
      return visible.find(h => h.handedness === 'right') || visible[0] || null;
    }

    const pinchPos = new THREE.Vector3();
    const aimPoint = new THREE.Vector3();
    function updateDart(dt) {
      if (dartState === 'flying') { updateFlight(dt); return; }
      if (!canThrow() && dartState !== 'held') { dart.visible = false; return; } // no dart during menus

      const info = (dartState === 'held') ? heldBy : getDartHand();
      if (!info) { dart.visible = false; return; }
      dart.visible = true;

      getPinchPoint(info, pinchPos);
      if (dartState === 'ready') pinchPos.y += 0.05; // float just above your fingers
      dart.position.copy(pinchPos);
      gripPos.copy(pinchPos);

      // While holding, remember where the hand was (used to measure the flick)
      if (dartState === 'held') recordHandSample(gripPos.copy(pinchPos));

      // Point the dart at the target you're looking at, or straight ahead
      if (gazedTarget) {
        aimPoint.copy(gazePoint);
      } else {
        camera.getWorldDirection(aimPoint);
        aimPoint.multiplyScalar(2).add(eyePos);
      }
      dart.lookAt(aimPoint);
      // Slide the dart back so your fingers hold the middle of the barrel, like a real grip
      dart.translateZ(-DART_GRIP);
    }
    const gripPos = new THREE.Vector3();

    // ---------- STAGE 4: FLICK TO THROW ----------
    // Settings you can tweak later on the real headset:
    // Test mode is switched on by adding ?test to the link (for the PC emulator).
    // The normal link = real headset mode: only a real flick throws.
    const URL_FLAGS = new URLSearchParams(location.search);
    const TEST_MODE = URL_FLAGS.has('test');
    const MIN_FLICK_SPEED = 0.5; // how fast (metres/second) your hand must move to count as a throw
    const GRAVITY = 4.0;         // gentle gravity (real life is 9.8) so throws feel forgiving
    const AIM_ASSIST = 0.9;      // 0 = only your hand direction, 1 = straight at the target you look at

    const handSamples = [];      // hand positions from the last 0.1 seconds
    const dartVel = new THREE.Vector3(); // dart speed + direction while flying
    let flightTime = 0;
    let throwStartY = 0;
    let dartSpin = 0;

    function recordHandSample(pos) {
      const now = performance.now();
      handSamples.push({ p: pos.clone(), t: now });
      while (handSamples.length > 2 && now - handSamples[0].t > 100) handSamples.shift();
    }

    // Hand speed = how far the hand moved, divided by how long it took
    function getHandVelocity() {
      if (handSamples.length < 2) return new THREE.Vector3();
      const first = handSamples[0];
      const last = handSamples[handSamples.length - 1];
      const seconds = (last.t - first.t) / 1000;
      if (seconds <= 0) return new THREE.Vector3();
      return last.p.clone().sub(first.p).divideScalar(seconds);
    }

    function throwDart(handVel) {
      let handSpeed = handVel.length();
      throwTooHard = handSpeed > LOB_MAX_HAND_SPEED;   // Stage 7: for Gentle Lob targets
      bouncedOff = null;
      bankBounced = false;                             // Stage 8
      noGravity = isBankStage();                       // Stage 8: bank shots fly straight

      if (handSpeed < MIN_FLICK_SPEED) {
        // Forgiving: a slow release still throws if you're looking at a target.
        // Only a slow release while looking away puts the dart back.
        if (!TEST_MODE && !gazedTarget) { cancelDart(); return; }
        handSpeed = 1.5;            // emulator: pretend you flicked
        handVel.copy(eyeDir);       // ...in the direction you're looking
      }

      // Turn a small hand flick into a satisfying dart speed (3 to 9 m/s)
      const dartSpeed = THREE.MathUtils.clamp(handSpeed * 3, 3, 9);
      const dir = handVel.clone().normalize();

      if (gazedTarget && gazedTarget.userData.type === 'lob') {
        // Gentle Lob: a high, soft arc that drops onto the table
        lobVelocity(dart.position, gazePoint, dartVel);
      } else if (gazedTarget) {
        // Aim assist: bend the throw toward the target you're looking at
        // Aim at the exact spot under your gaze dot (not just the target's centre)
        const toTarget = gazePoint.clone().sub(dart.position);
        const distance = toTarget.length();
        const assist = TEST_MODE ? 1 : AIM_ASSIST; // emulator: perfect aim, so you can test each ring
        dir.lerp(toTarget.normalize(), assist).normalize();
        dartVel.copy(dir).multiplyScalar(dartSpeed);
        // Aim a little higher so gravity drops the dart onto the target
        if (!noGravity) dartVel.y += 0.5 * GRAVITY * (distance / dartSpeed);
      } else {
        dartVel.copy(dir).multiplyScalar(dartSpeed);
      }

      sfxThrow();
      dartState = 'flying';
      flightTime = 0;
      throwStartY = dart.position.y;
      setDartSolid(true);
    }

    // Move the flying dart a little each frame
    function updateFlight(dt) {
      flightTime += dt;
      if (!noGravity) dartVel.y -= GRAVITY * dt; // gravity pulls it down

      // STAGE 5: before moving, check if the dart's path crosses a target this frame
      if (checkTargetHit(dt)) return;

      dart.position.addScaledVector(dartVel, dt); // move it
      aimPoint.copy(dart.position).add(dartVel);
      dart.lookAt(aimPoint);                      // nose points where it's going
      dartSpin += dt * 9;                         // real darts slowly spin in flight
      dart.rotateZ(dartSpin);

      // After 2 seconds, or if it drops 1.5 m below where it was thrown, it's a miss
      if (flightTime > 2 || dart.position.y < throwStartY - 1.5) {
        showPopup('MISS', '#ffffff', dart.position);
        sfxMiss();
        resetDart();
        onThrowResult(0, null);
      }
    }

    function resetDart() {
      dartState = 'ready';
      setDartSolid(false);
    }

    // ---------- STAGE 5: HITTING + STICKING ----------
    const DART_TIP = 0.09;          // distance from the dart's middle to its tip (metres)
    const MAX_STUCK = 10;           // how many darts can stay stuck at once
    const stuckDarts = [];
    const hitRay = new THREE.Raycaster();
    const moveDir = new THREE.Vector3();
    const localHit = new THREE.Vector3();

    // Ring sizes match makeTarget(): red 0.06, yellow 0.15, blue 0.25
    function ringScore(distanceFromCentre) {
      if (distanceFromCentre <= 0.06) return { points: 100, text: 'BULLSEYE! +100', color: '#ff2d55' };
      if (distanceFromCentre <= 0.15) return { points: 50,  text: '+50',            color: '#ffd23f' };
      if (distanceFromCentre <= 0.25) return { points: 20,  text: '+20',            color: '#2f7bff' };
      return null;
    }

    function checkTargetHit(dt) {
      // Shoot a short invisible line from the dart forward, as long as this frame's move + the tip
      moveDir.copy(dartVel).normalize();
      hitRay.set(dart.position, moveDir);
      hitRay.far = dartVel.length() * dt + DART_TIP;

      const hits = hitRay.intersectObjects(targets.filter(t => t.visible && t !== bouncedOff), true)
        .filter(h => !h.object.userData.isStuckDart);   // ignore darts already stuck there
      if (hits.length === 0) return false;

      const hit = hits[0];
      let hitTarget = hit.object;
      while (hitTarget.parent && !targets.includes(hitTarget)) hitTarget = hitTarget.parent;

      // How far from the centre did it land? (measured on the target itself)
      // Stage 8: special trick-shot objects
      if (hitTarget.userData.type === 'bouncer') { bankBounce(hitTarget, hit); return false; }
      if (hitTarget.userData.type === 'blocker') {
        dart.position.copy(hit.point).addScaledVector(moveDir, -(DART_TIP - 0.015));
        stickCopy(hitTarget);
        showPopup('BLOCKED', '#ff3b6b', hit.point);
        sfxThud();
        resetDart();
        onThrowResult(0, hitTarget);
        return true;
      }

      localHit.copy(hit.point);
      hitTarget.worldToLocal(localHit);
      const result = scoreHit(hitTarget, localHit);   // Stage 7: each target type scores differently
      if (!result) return false;   // touched the edge only, keep flying

      // Gentle Lob: thrown too hard? The dart bounces off instead of sticking
      if (hitTarget.userData.type === 'lob' && throwTooHard) {
        bounceOff(hitTarget, hit);
        return false;
      }

      // Put the dart so its tip sinks slightly into the board
      dart.position.copy(hit.point).addScaledVector(moveDir, -(DART_TIP - 0.015));
      aimPoint.copy(hit.point).add(moveDir);
      dart.lookAt(aimPoint);

      stickCopy(hitTarget);
      showPopup(result.text, result.color, hit.point);
      sfxHit(result.points);
      spawnBurst(hit.point, result.color);
      resetDart();
      onThrowResult(result.points, hitTarget);   // Stage 6: add to the score
      return true;
    }

    // Leave a solid copy of the dart stuck in the target; the real dart returns to your hand
    // A stuck dart quivers for a moment, like a real one hitting a board
    const wobbles = [];
    const wobbleAxis = new THREE.Vector3(1, 0, 0);
    const wobbleQuat = new THREE.Quaternion();
    function updateWobbles(dt) {
      for (let i = wobbles.length - 1; i >= 0; i--) {
        const w = wobbles[i];
        w.t += dt;
        const angle = 0.12 * Math.exp(-w.t * 9) * Math.sin(w.t * 55);
        w.obj.quaternion.copy(w.base).multiply(wobbleQuat.setFromAxisAngle(wobbleAxis, angle));
        if (w.t > 0.6) { w.obj.quaternion.copy(w.base); wobbles.splice(i, 1); }
      }
    }

    function stickCopy(hitTarget) {
      const copy = dart.clone(true);
      copy.traverse(o => {
        o.userData.isStuckDart = true;
        if (o.material) { o.material = o.material.clone(); o.material.opacity = 1; }
      });
      hitTarget.attach(copy);   // becomes part of the target, so it moves with it later
      stuckDarts.push(copy);
      wobbles.push({ obj: copy, base: copy.quaternion.clone(), t: 0 });   // little shake on impact
      if (stuckDarts.length > MAX_STUCK) {
        const oldest = stuckDarts.shift();
        oldest.parent.remove(oldest);
      }
    }

    // Floating score text that rises and fades out
    const popups = [];
    function showPopup(text, color, position) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      // Shrink the font if the text is too wide, so nothing gets cut off (e.g. "+100")
      let size = 80;
      do { ctx.font = 'bold ' + size + 'px Arial'; size -= 4; }
      while (ctx.measureText(text).width > 980 && size > 24);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#000000';
      ctx.strokeText(text, 512, 64);
      ctx.fillStyle = color;
      ctx.fillText(text, 512, 64);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false
      }));
      sprite.scale.set(0.6, 0.075, 1);
      sprite.position.copy(position);
      sprite.position.y += 0.15;
      sprite.renderOrder = 998;
      scene.add(sprite);
      popups.push({ sprite, age: 0 });
    }

    function updatePopups(dt) {
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.age += dt;
        p.sprite.position.y += 0.15 * dt;              // float up
        p.sprite.material.opacity = 1 - p.age / 1.2;   // fade out
        if (p.age > 1.2) {
          scene.remove(p.sprite);
          p.sprite.material.map.dispose();
          p.sprite.material.dispose();
          popups.splice(i, 1);
        }
      }
    }

    // ---------- STAGE 6: SCORING, MENUS + HUD ----------
    const PRACTICE_DARTS = 3;
    const ROUND_DARTS = 10;

    // mode: 'intro' | 'practice' | 'practiceDone' | 'round' | 'results'
    const game = { mode: 'intro', thrown: 0, score: 0, hits: 0, best: 0, streak: 0, bestStreak: 0, waiting: false };

    // Hand-tracking check: is at least one hand (or controller) being seen right now?
    function handsVisible() {
      return hands.some(h => {
        if (!h.connected) return false;
        if (!h.isHand) return true;
        const wrist = h.hand.joints['wrist'];
        return !!(wrist && wrist.visible);
      });
    }

    function isPlaying() { return game.mode === 'practice' || game.mode === 'round' || game.mode === 'trick'; }
    function canThrow() { return isPlaying() && !game.waiting && handsVisible(); }

    // Helper: a flat rectangle we can draw text on (like a little screen)
    function makeCanvasPlane(width, height, pxW, pxH) {
      const canvas = document.createElement('canvas');
      canvas.width = pxW; canvas.height = pxH;
      const texture = new THREE.CanvasTexture(canvas);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false })
      );
      mesh.renderOrder = 990;
      return { mesh, canvas, ctx: canvas.getContext('2d'), texture };
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ----- Menu panel (How to Play, Practice done, Results) -----
    const menu = new THREE.Group();
    const menuPanel = makeCanvasPlane(0.9, 0.6, 900, 600);
    const menuButtons = [0, 1, 2, 3].map(() => makeCanvasPlane(0.4, 0.1, 400, 100));
    menu.add(menuPanel.mesh);
    menuButtons.forEach(b => { b.mesh.renderOrder = 991; menu.add(b.mesh); });
    menu.visible = false;
    scene.add(menu);

    const buttons = menuButtons.map(b => b.mesh);
    let gazedButton = null;
    let menuPlaceFrames = 0;   // wait a few frames so we know where your head is

    // btns = [{ text, action }] — one or two buttons
    function drawMenu(title, lines, btns) {
      const c = menuPanel.ctx;
      c.clearRect(0, 0, 900, 600);
      roundRect(c, 10, 10, 880, 580, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.88)'; c.fill();
      c.lineWidth = 6; c.strokeStyle = '#ff3b6b'; c.stroke();

      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = '#ff3b6b'; c.font = 'bold 64px Arial';
      c.fillText(title, 450, 80);
      c.fillStyle = '#ffffff'; c.font = '40px Arial';
      lines.forEach((line, i) => c.fillText(line, 450, 170 + i * 56));
      menuPanel.texture.needsUpdate = true;

      menuButtons.forEach((button, i) => {
        const info = btns[i];
        button.mesh.visible = !!info;
        if (!info) return;
        button.mesh.userData.action = info.action;
        // 1 button: centre. 2: side by side. 3-4: two rows of two.
        const col = btns.length === 1 ? 0 : (i % 2 === 0 ? -0.215 : 0.215);
        const row = btns.length <= 2 ? -0.2 : (i < 2 ? -0.11 : -0.23);
        button.mesh.position.set(col, row, 0.01);
        const b = button.ctx;
        b.clearRect(0, 0, 400, 100);
        roundRect(b, 4, 4, 392, 92, 46);
        b.fillStyle = info.color || (i === 0 ? '#39ff88' : '#ffd23f'); b.fill();
        b.fillStyle = '#0b0f1a'; b.font = 'bold 38px Arial';
        b.textAlign = 'center'; b.textBaseline = 'middle';
        b.fillText(info.text, 200, 52);
        button.texture.needsUpdate = true;
      });
    }

    function showMenu(which) {
      game.mode = which;
      game.waiting = false;
      if (which === 'intro') {
        drawMenu('HOW TO PLAY', [
          '1. Look at a target.',
          '2. Pinch to hold a dart.',
          '3. Flick your hand to throw.',
          '4. Hit the center for more points.',
          'Look at the button + pinch to start'
        ], [{ text: 'START PRACTICE', action: 'startPractice' }, { text: 'SETTINGS', action: 'settings', color: '#4fd8ff' }]);
      } else if (which === 'practiceDone') {
        drawMenu('PRACTICE DONE!', [
          'Now the real round: ' + ROUND_DARTS + ' darts.',
          'Red centre = 100',
          'Yellow = 50   Blue = 20'
        ], [{ text: 'START ROUND', action: 'startRound' }]);
      } else if (which === 'results') {
        const accuracy = Math.round((game.hits / ROUND_DARTS) * 100);
        drawMenu('ROUND COMPLETE', [
          'Total score: ' + game.score,
          'Best throw: ' + game.best,
          'Accuracy: ' + accuracy + '%',
          'Best streak: ' + game.bestStreak
        ], [{ text: 'PLAY AGAIN', action: 'startRound' }, { text: 'TRICK SHOTS', action: 'startTrick' }]);
        game.trickUnlocked = true;   // Stage 8: Trick Shot mode unlocks after your first round
        sfxFanfare();
      } else if (which === 'trickIntro') {
        const t = TRICKS[trick.stage];
        drawMenu('TRICK ' + (trick.stage + 1) + '/3: ' + t.name, t.intro, [{ text: 'GO!', action: 'trickGo' }]);
      } else if (which === 'trickResults') {
        drawTrickResults();
        sfxFanfare();
      } else if (which === 'pause') {
        drawMenu('PAUSED', ['Take a break!', 'Look at a button and pinch.'], [
          { text: 'RESUME', action: 'resume' },
          { text: 'RESTART', action: 'restart', color: '#ffd23f' },
          { text: 'HOW TO PLAY', action: 'howto', color: '#b59bff' },
          { text: 'SETTINGS', action: 'settings', color: '#4fd8ff' }]);
      } else if (which === 'howto') {
        drawMenu('HOW TO PLAY', [
          '1. Look at a target.',
          '2. Pinch to hold a dart.',
          '3. Flick your hand to throw.',
          '4. Hit the center for more points.'
        ], [{ text: 'BACK', action: 'back' }]);
      } else if (which === 'settings') {
        drawMenu('SETTINGS', [
          'Pinch a button to change it.',
          'Distance applies to the next round.'
        ], [
          { text: 'SOUND: ' + (settings.sound ? 'ON' : 'OFF'), action: 'toggleSound', color: '#4fd8ff' },
          { text: 'MUSIC: ' + (settings.music ? 'ON' : 'OFF'), action: 'toggleMusic', color: '#4fd8ff' },
          { text: 'DIST: ' + DISTANCES[settings.distanceIndex].name, action: 'cycleDistance', color: '#4fd8ff' },
          { text: 'BACK', action: 'back' }]);
      }
      menu.visible = true;
      menuPlaceFrames = 3;
      targets.forEach(t => t.visible = false);
      hud.mesh.visible = false;
      pauseButton.visible = false;
    }

    function hideMenu() {
      menu.visible = false;
      gazedButton = null;
      targets.forEach(t => t.visible = activeTargets.includes(t));
      hud.mesh.visible = true;
    }

    // Put the menu 1 metre in front of where you're facing (ignores looking up/down)
    const flatDir = new THREE.Vector3();
    function placeMenu() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(flatDir);
      flatDir.y = 0;
      if (flatDir.lengthSq() < 0.001) flatDir.set(0, 0, -1);
      flatDir.normalize();
      menu.position.copy(eyePos).addScaledVector(flatDir, 1.0);
      menu.position.y = eyePos.y - 0.05;
      menu.lookAt(eyePos.x, menu.position.y, eyePos.z);
    }

    function pressButton(button) {
      const action = button.userData.action;
      if (action === 'pause' && dartState === 'flying') return; // wait for the dart to land
      sfxClick();
      if (handleMenuAction(action)) return;   // Stage 9: pause / settings buttons
      hideMenu();
      if (action === 'startPractice') startPractice();
      if (action === 'startRound') startRound();
      if (action === 'startTrick') startTrick();
      if (action === 'trickGo') trickGo();
    }

    function clearStuckDarts() {
      stuckDarts.forEach(d => d.parent && d.parent.remove(d));
      stuckDarts.length = 0;
    }

    function resetStats() {
      Object.assign(game, { thrown: 0, score: 0, hits: 0, best: 0, streak: 0, bestStreak: 0, waiting: false });
    }

    function startPractice() {
      clearStuckDarts(); resetStats();
      lastPlay = 'practice';
      activeTargets = mainTargets;
      targets.forEach(t => t.visible = activeTargets.includes(t));
      placeTargets();
      placePauseButton();
      game.mode = 'practice';
      drawHud();
    }

    function startRound() {
      clearStuckDarts(); resetStats();
      lastPlay = 'round';
      activeTargets = mainTargets;
      targets.forEach(t => t.visible = activeTargets.includes(t));
      placeTargets();
      placePauseButton();
      game.mode = 'round';
      drawHud();
    }

    // Called once after every throw (hit = points, miss = 0)
    function onThrowResult(points, hitTarget) {
      if (!isPlaying()) return;
      if (game.mode === 'trick') { trickThrow(points, hitTarget); return; } // Stage 8
      game.thrown++;

      if (game.mode === 'round') {
        game.score += points;
        game.best = Math.max(game.best, points);
        if (points > 0) {
          game.hits++;
          game.streak++;
          game.bestStreak = Math.max(game.bestStreak, game.streak);
        } else {
          game.streak = 0;
        }
      }
      drawHud();

      const total = game.mode === 'practice' ? PRACTICE_DARTS : ROUND_DARTS;
      if (game.thrown >= total) {
        game.waiting = true; // short pause so you can see your last score popup
        const next = game.mode === 'practice' ? 'practiceDone' : 'results';
        setTimeout(() => showMenu(next), 1500);
      }
    }

    // ----- HUD: small score bar fixed near the bottom of your view -----
    const hud = makeCanvasPlane(0.6, 0.12, 1000, 200);
    hud.mesh.position.set(0, -0.32, -1);
    hud.mesh.onBeforeRender = () => hud.mesh.updateMatrixWorld();
    hud.mesh.visible = false;
    camera.add(hud.mesh);

    function drawHud() {
      if (game.mode === 'trick') { drawTrickHud(); return; } // Stage 8
      const c = hud.ctx;
      const total = game.mode === 'practice' ? PRACTICE_DARTS : ROUND_DARTS;
      c.clearRect(0, 0, 1000, 200);
      roundRect(c, 10, 10, 980, 180, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.7)'; c.fill();

      c.textBaseline = 'middle'; c.textAlign = 'left';
      c.fillStyle = '#ff3b6b'; c.font = 'bold 48px Arial';
      c.fillText(game.mode === 'practice' ? 'PRACTICE' : 'SCORE ' + game.score, 40, 70);
      c.textAlign = 'right'; c.fillStyle = '#ffffff'; c.font = '44px Arial';
      c.fillText('Dart ' + Math.min(game.thrown + 1, total) + ' / ' + total, 960, 70);

      // Progress bar: one block per dart
      const gap = 10, barW = 920, w = (barW - gap * (total - 1)) / total;
      for (let i = 0; i < total; i++) {
        c.fillStyle = i < game.thrown ? '#39ff88' : 'rgba(255,255,255,0.25)';
        roundRect(c, 40 + i * (w + gap), 125, w, 36, 10);
        c.fill();
      }
      hud.texture.needsUpdate = true;
    }

    // ----- "Hands not detected" message -----
    const handsMsg = makeCanvasPlane(0.6, 0.12, 1000, 200);
    handsMsg.mesh.position.set(0, 0.08, -1);
    handsMsg.mesh.onBeforeRender = () => handsMsg.mesh.updateMatrixWorld();
    handsMsg.mesh.visible = false;
    camera.add(handsMsg.mesh);
    (() => {
      const c = handsMsg.ctx;
      roundRect(c, 10, 10, 980, 180, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.85)'; c.fill();
      c.lineWidth = 6; c.strokeStyle = '#ffd23f'; c.stroke();
      c.fillStyle = '#ffffff'; c.font = 'bold 44px Arial';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('Hands not detected.', 500, 70);
      c.fillText('Bring your hands into view.', 500, 130);
      handsMsg.texture.needsUpdate = true;
    })();

    // Runs every frame: menu placement, button gaze, hands message
    const buttonScaleBig = new THREE.Vector3(1.08, 1.08, 1);
    function updateUI() {
      if (menu.visible && menuPlaceFrames > 0) {
        menuPlaceFrames--;
        placeMenu();
      }

      gazedButton = null;
      pauseButton.visible = renderer.xr.isPresenting && isPlaying() && !game.waiting;
      const clickable = menu.visible ? buttons.filter(b => b.visible) : (pauseButton.visible ? [pauseButton] : []);
      if (clickable.length) {
        const hits = raycaster.intersectObjects(clickable, false);
        if (hits.length > 0) gazedButton = hits[0].object;
      }
      pauseButton.scale.lerp(gazedButton === pauseButton ? buttonScaleBig : normalSize, 0.2);
      buttons.forEach(b => b.scale.lerp(b === gazedButton ? buttonScaleBig : normalSize, 0.2));
      if (gazedButton) gazeDot.material.color.set(0x39ff88);

      handsMsg.mesh.visible = renderer.xr.isPresenting && isPlaying() && !handsVisible();
    }

    // ---------- STAGE 7: FOUR TARGET TYPES + ROOM SURFACES ----------
    const LOB_MAX_HAND_SPEED = 2.5; // flick faster than this (m/s) at a Lob target = "too hard"
    const LOB_FLIGHT_TIME = 0.8;    // seconds a lob takes to land (higher = taller arc)
    const FAST_SPEED = 0.35;        // Moving target counts as "fast" above this speed (m/s)
    const FAST_BONUS = 30;
    let throwTooHard = false;
    let bouncedOff = null;

    // A soft arc that lands exactly on 'to' after LOB_FLIGHT_TIME seconds
    function lobVelocity(from, to, out) {
      const T = LOB_FLIGHT_TIME;
      out.copy(to).sub(from).divideScalar(T);
      out.y += 0.5 * GRAVITY * T;
      return out;
    }

    // Small text label that floats above a target (not clickable)
    function makeLabel(text, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 96;
      const c = canvas.getContext('2d');
      roundRect(c, 4, 4, 504, 88, 44);
      c.fillStyle = 'rgba(11, 15, 26, 0.75)'; c.fill();
      c.fillStyle = color; c.font = 'bold 48px Arial';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(text, 256, 50);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false
      }));
      sprite.scale.set(0.38, 0.071, 1);
      sprite.renderOrder = 997;
      sprite.raycast = () => {};   // the gaze and darts ignore labels
      scene.add(sprite);
      return sprite;
    }

    function addTarget(group, type, labelText, labelColor) {
      group.userData.type = type;
      group.userData.baseScale = 1;
      group.userData.label = makeLabel(labelText, labelColor);
      group.userData.speed = 0;
      targets.push(group);
      scene.add(group);
      return group;
    }

    // 1. Straight Throw: the normal board, goes on a wall
    const straightTarget = addTarget(makeTarget(), 'straight', 'STRAIGHT', '#ffffff');

    // 2. Gentle Lob: the normal board lying flat on a table
    const lobTarget = addTarget(makeTarget(), 'lob', 'GENTLE LOB', '#39ff88');

    // 3. Moving: the normal board sliding left and right
    const movingTarget = addTarget(makeTarget(), 'moving', 'MOVING', '#ffd23f');

    // 4. Weak Point: a big purple board with one small glowing spot
    const WEAK_BOARD = 0.32, WEAK_SPOT = 0.06;
    const weakGroup = new THREE.Group();
    const weakBoard = new THREE.Mesh(
      new THREE.CircleGeometry(WEAK_BOARD, 64),
      new THREE.MeshBasicMaterial({ color: 0x6a3cff })
    );
    const weakRim = new THREE.Mesh(
      new THREE.RingGeometry(WEAK_BOARD - 0.02, WEAK_BOARD, 64),
      new THREE.MeshBasicMaterial({ color: 0xb59bff })
    );
    weakRim.position.z = 0.001;
    const weakGlow = new THREE.Mesh(
      new THREE.CircleGeometry(WEAK_SPOT * 1.8, 32),
      new THREE.MeshBasicMaterial({ color: 0x39ff88, transparent: true, opacity: 0.35 })
    );
    weakGlow.position.z = 0.002;
    const weakSpot = new THREE.Mesh(
      new THREE.CircleGeometry(WEAK_SPOT, 32),
      new THREE.MeshBasicMaterial({ color: 0x39ff88 })
    );
    weakSpot.position.z = 0.003;
    weakGroup.add(weakBoard, weakRim, weakGlow, weakSpot);
    const weakTarget = addTarget(weakGroup, 'weak', 'WEAK POINT', '#b59bff');

    // Move the weak point to a new random spot (after each hit)
    function moveWeakSpot() {
      const angle = Math.random() * Math.PI * 2;
      const r = 0.06 + Math.random() * 0.14;
      weakSpot.position.x = weakGlow.position.x = Math.cos(angle) * r;
      weakSpot.position.y = weakGlow.position.y = Math.sin(angle) * r;
    }
    moveWeakSpot();
    targets.forEach(t => t.visible = false); // hidden until the game places them

    // Scoring for each target type. 'local' = where the dart landed, measured on the target.
    function scoreHit(t, local) {
      const type = t.userData.type;
      if (type === 'weak') {
        const toSpot = Math.hypot(local.x - weakSpot.position.x, local.y - weakSpot.position.y);
        if (toSpot <= WEAK_SPOT * 1.2) {   // a little forgiving
          setTimeout(moveWeakSpot, 400);
          return { points: 150, text: 'WEAK POINT! +150', color: '#39ff88' };
        }
        if (Math.hypot(local.x, local.y) <= WEAK_BOARD) return { points: 20, text: '+20', color: '#b59bff' };
        return null;
      }

      const result = ringScore(Math.hypot(local.x, local.y));
      if (result && type === 'moving' && Math.abs(t.userData.speed) > FAST_SPEED) {
        return { points: result.points + FAST_BONUS,
                 text: result.text + '  FAST +' + FAST_BONUS, color: result.color };
      }
      return result;
    }

    // Too-hard throw at a lob target: the dart ricochets up and away (counts as a miss)
    const bounceNormal = new THREE.Vector3();
    function bounceOff(t, hit) {
      bouncedOff = t;
      bounceNormal.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);
      dartVel.reflect(bounceNormal).multiplyScalar(0.45);
      showPopup('TOO HARD!', '#ffd23f', hit.point);
      sfxThud(); sfxBounce();
    }

    // ----- Room surfaces (Quest 3 / 3S "plane detection") -----
    // Every frame we remember the walls and tables the headset has found.
    let roomPlanes = [];
    const tmpMatrix = new THREE.Matrix4();
    function scanPlanes(frame) {
      const refSpace = renderer.xr.getReferenceSpace();
      if (!frame || !frame.detectedPlanes || !refSpace) return;
      const list = [];
      frame.detectedPlanes.forEach(plane => {
        const pose = frame.getPose(plane.planeSpace, refSpace);
        if (!pose) return;
        tmpMatrix.fromArray(pose.transform.matrix);
        // Centre of the plane's outline, and its size
        let cx = 0, cz = 0, minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        plane.polygon.forEach(p => {
          cx += p.x; cz += p.z;
          minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
          minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
        });
        const n = Math.max(plane.polygon.length, 1);
        const centre = new THREE.Vector3(cx / n, 0, cz / n).applyMatrix4(tmpMatrix);
        const normal = new THREE.Vector3(0, 1, 0).transformDirection(tmpMatrix); // plane's "up"
        list.push({
          orientation: plane.orientation, // 'horizontal' or 'vertical'
          label: plane.semanticLabel || '',
          centre, normal,
          width: maxX - minX, depth: maxZ - minZ
        });
      });
      roomPlanes = list;
    }

    // Find a wall in front of you, 1–3.5 m away. Returns the spot straight ahead on it.
    const toPlane = new THREE.Vector3();
    function findWall() {
      let best = null;
      roomPlanes.forEach(p => {
        if (p.orientation !== 'vertical') return;
        if (p.label && p.label !== 'wall') return;   // skip doors, windows, screens...
        const normal = p.normal.clone();
        normal.y = 0; normal.normalize();
        if (normal.dot(flatDir) > 0) normal.negate(); // make it face you
        const facing = -normal.dot(flatDir);
        if (facing < 0.75) return;                    // wall must be roughly in front of you
        // Where does your straight-ahead line meet the wall?
        toPlane.copy(p.centre).sub(eyePos);
        const distance = -toPlane.dot(normal) / facing;
        if (distance < 1.0 || distance > 3.5) return;
        const spot = eyePos.clone().addScaledVector(flatDir, distance);
        if (!best || distance < best.distance) best = { spot, normal, distance };
      });
      return best;
    }

    // Find a table/desk/low surface in front of you (top facing up, 25–100 cm below your eyes)
    function findTable() {
      let best = null;
      roomPlanes.forEach(p => {
        if (p.orientation !== 'horizontal') return;
        if (p.label === 'floor' || p.label === 'ceiling') return;
        if (p.normal.y < 0.9) return;
        const below = eyePos.y - p.centre.y;
        if (below < 0.25 || below > 1.0) return;
        if (p.width < 0.35 || p.depth < 0.35) return;      // big enough for the board
        toPlane.copy(p.centre).sub(eyePos); toPlane.y = 0;
        const distance = toPlane.length();
        if (distance < 0.5 || distance > 2.0) return;
        if (toPlane.normalize().dot(flatDir) < 0.4) return; // roughly in front
        if (!best || distance < best.distance) best = { spot: p.centre.clone(), distance };
      });
      return best;
    }

    // Place a target at (forward, up, side) metres from your eyes, facing you
    let forwardLimit = Infinity;   // stay in front of a detected wall
    function placeRelative(t, forward, up, side) {
      forward = Math.min(forward * DISTANCES[settings.distanceIndex].scale, forwardLimit);
      t.position.copy(eyePos).addScaledVector(flatDir, forward).addScaledVector(sideDir, side);
      t.position.y = eyePos.y + up;
      t.lookAt(eyePos.x, t.position.y, eyePos.z);
    }

    const sideDir = new THREE.Vector3();
    function placeTargets() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(flatDir);
      flatDir.y = 0;
      if (flatDir.lengthSq() < 0.001) flatDir.set(0, 0, -1);
      flatDir.normalize();
      sideDir.set(-flatDir.z, 0, flatDir.x); // points to your right

      const wall = findWall();
      const table = findTable();
      forwardLimit = wall ? wall.distance - 0.2 : Infinity;
      let maxForward = 2.0;  // floating targets must stay in front of any wall

      // 1. Straight Throw: on the wall, or 2 m in front of you
      if (wall) {
        straightTarget.position.copy(wall.spot).addScaledVector(wall.normal, 0.01);
        straightTarget.position.y = eyePos.y - 0.05;
        straightTarget.lookAt(straightTarget.position.clone().add(wall.normal));
        maxForward = Math.min(2.0, wall.distance - 0.2);
        // Far walls get a bigger board so it's still easy to see
        straightTarget.userData.baseScale = THREE.MathUtils.clamp(wall.distance / 2, 1, 1.5);
      } else {
        placeRelative(straightTarget, 2.0, -0.05, 0);
        straightTarget.userData.baseScale = 1;
      }

      // 2. Gentle Lob: flat on the table, or floating flat at table height
      if (table) {
        lobTarget.position.copy(table.spot);
        lobTarget.position.y += 0.005;
      } else {
        placeRelative(lobTarget, 1.1, -0.55, 0.35);
      }
      lobTarget.lookAt(lobTarget.position.x, lobTarget.position.y + 1, lobTarget.position.z); // face up

      // 3. Moving: upper left, slides side to side
      placeRelative(movingTarget, Math.min(1.8, maxForward), 0.3, -0.75);
      movingTarget.userData.home = movingTarget.position.clone();
      movingTarget.userData.slideDir = sideDir.clone();
      movingTarget.userData.phase = 0;

      // 4. Weak Point: upper right
      placeRelative(weakTarget, Math.min(1.9, maxForward), 0.3, 0.8);
      moveWeakSpot();

      // Tell the player what we found
      const found = [wall ? 'wall' : null, table ? 'table' : null].filter(Boolean);
      const msg = found.length ? 'Using your ' + found.join(' + ') : 'Targets placed in front of you';
      showPopup(msg, '#ffffff', straightTarget.position.clone().add(new THREE.Vector3(0, 0.3, 0)));
    }

    // Runs every frame: slide the moving target, pulse the weak point, keep labels above targets
    const SLIDE_RANGE = 0.3;
    let targetTime = 0;
    function updateTargets(dt) {
      targetTime += dt;

      // Moving target speeds up and slows down so there are "fast" moments to aim for
      const m = movingTarget.userData;
      if (m.home) {
        const angularSpeed = 1.4 + 1.1 * Math.sin(targetTime * 0.5); // 0.3 to 2.5
        m.phase += angularSpeed * dt;
        const offset = Math.sin(m.phase) * SLIDE_RANGE;
        m.speed = Math.cos(m.phase) * SLIDE_RANGE * angularSpeed;  // metres per second
        movingTarget.position.copy(m.home).addScaledVector(m.slideDir, offset);
      }

      // Weak point gently pulses
      const pulse = 1 + 0.25 * Math.sin(targetTime * 5);
      weakGlow.scale.set(pulse, pulse, 1);

      // Labels follow their targets
      targets.forEach(t => {
        const label = t.userData.label;
        label.visible = t.visible;
        label.position.copy(t.position);
        label.position.y += t.userData.type === 'lob' ? 0.12 : 0.36 * (t.userData.baseScale || 1);
      });
    }

    // ---------- STAGE 8: TRICK SHOT MODE ----------
    const mainTargets = [straightTarget, lobTarget, movingTarget, weakTarget];
    let activeTargets = mainTargets;   // which targets show during play
    let noGravity = false;
    let bankBounced = false;
    const BANK_ASSIST = 0.6;   // after a bounce, how much the dart bends toward the bank target
    const CHAIN_TIME = 15;     // seconds to hit 1, 2, 3

    const TRICKS = [
      { name: 'TINY TARGET', limit: 10, goal: 3, intro: [
        'A small target slides side to side.',
        'Hit it 3 times.',
        'Hits in a row give a COMBO bonus!'] },
      { name: 'BANK SHOT', limit: 8, goal: 2, intro: [
        'A red barrier blocks the target.',
        'Look at the blue BOUNCE panel,',
        'follow the green guide line and throw.',
        'Bank it into the target 2 times.'] },
      { name: 'TARGET CHAIN', limit: 15, goal: 3, intro: [
        'Hit targets 1, 2, 3 in that order',
        'within ' + CHAIN_TIME + ' seconds.',
        'A mistake just restarts the chain.',
        'No points lost!'] }
    ];
    const trick = { stage: 0, darts: 0, hits: 0, streak: 0, score: 0,
                    chainNext: 0, chainTime: CHAIN_TIME, chainDone: false, results: [] };

    function hideNew(t) { t.visible = false; return t; }
    function setBaseScale(t, s) { t.userData.baseScale = s; t.scale.setScalar(s); return t; }

    // Challenge 1: a small sliding target
    const tinyTarget = hideNew(setBaseScale(addTarget(makeTarget(), 'tiny', 'TINY', '#ff3b6b'), 0.5));

    // Challenge 2: target behind a barrier, plus a panel to bounce off
    const bankTarget = hideNew(addTarget(makeTarget(), 'bank', 'BANK TARGET', '#ffd23f'));
    function makePanel(color, opacity) {
      const g = new THREE.Group();
      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.5),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide }));
      const edge = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(0.6, 0.5)),
        new THREE.LineBasicMaterial({ color }));
      edge.raycast = () => {};
      g.add(face, edge);
      return g;
    }
    const bouncer = hideNew(addTarget(makePanel(0x4fd8ff, 0.35), 'bouncer', 'BOUNCE HERE', '#4fd8ff'));
    const blocker = hideNew(addTarget(makePanel(0xff3b6b, 0.3), 'blocker', 'BARRIER', '#ff3b6b'));

    // Challenge 3: three numbered targets
    const chainTargets = [0, 1, 2].map(i => {
      const t = hideNew(setBaseScale(addTarget(makeTarget(), 'chain', String(i + 1), '#ffffff'), 0.6));
      t.userData.order = i;
      return t;
    });

    const TRICK_TARGETS = [[tinyTarget], [bankTarget, bouncer, blocker], chainTargets];
    function isBankStage() { return game.mode === 'trick' && trick.stage === 1; }

    // Where you are and which way you face (flat), plus a scale to keep things in front of walls
    function readHeading() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(flatDir);
      flatDir.y = 0;
      if (flatDir.lengthSq() < 0.001) flatDir.set(0, 0, -1);
      flatDir.normalize();
      sideDir.set(-flatDir.z, 0, flatDir.x);
      const wall = findWall();
      forwardLimit = wall ? wall.distance - 0.2 : Infinity;
      return wall ? Math.min(1, (wall.distance - 0.2) / 2.0) : 1;
    }

    function startTrick() {
      trick.stage = 0;
      trick.results = [];
      showMenu('trickIntro');
    }

    // Start the current challenge
    function trickGo() {
      clearStuckDarts();
      Object.assign(trick, { darts: 0, hits: 0, streak: 0, score: 0, chainNext: 0, chainDone: false });
      const k = readHeading();
      if (trick.stage === 0) {
        placeRelative(tinyTarget, 1.8 * k, 0.05, 0);
        tinyTarget.userData.home = tinyTarget.position.clone();
        tinyTarget.userData.phase = 0;
      } else if (trick.stage === 1) {
        placeRelative(bankTarget, 2.0 * k, 0, 0);
        placeRelative(blocker, 1.2 * k, 0, 0);
        placeRelative(bouncer, 1.4 * k, 0, 0.75);
        // Angle the bounce panel halfway between "towards you" and "towards the target"
        const toEye = eyePos.clone().sub(bouncer.position).normalize();
        const toTarget = bankTarget.position.clone().sub(bouncer.position).normalize();
        const normal = toEye.add(toTarget).normalize();
        bouncer.lookAt(bouncer.position.clone().add(normal));
      } else {
        resetChain(k);
      }
      activeTargets = TRICK_TARGETS[trick.stage];
      lastPlay = 'trick';
      placePauseButton();
      game.mode = 'trick';
      game.waiting = false;
      hideMenu();
      drawHud();
    }

    // ----- Bank shot bounce -----
    const panelNormal = new THREE.Vector3();
    function bankRedirect(inDir, fromPoint, out) {
      panelNormal.set(0, 0, 1).applyQuaternion(bouncer.quaternion);
      out.copy(inDir).reflect(panelNormal);
      const toTarget = bankTarget.position.clone().sub(fromPoint).normalize();
      return out.lerp(toTarget, BANK_ASSIST).normalize();   // forgiving: bend toward the target
    }
    function bankBounce(panel, hit) {
      const speed = dartVel.length();
      bankRedirect(moveDir, hit.point, dartVel).multiplyScalar(speed);
      dart.position.copy(hit.point).addScaledVector(dartVel, 0.01);
      bouncedOff = panel;   // don't hit the same panel twice
      bankBounced = true;
      showPopup('BOUNCE!', '#4fd8ff', hit.point);
      sfxBounce();
      spawnBurst(hit.point, '#4fd8ff');
    }

    // Green dashed guide line: hand -> bounce panel -> where the dart will go
    const guideGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()]);
    const guide = new THREE.Line(guideGeo, new THREE.LineDashedMaterial({
      color: 0x39ff88, dashSize: 0.04, gapSize: 0.03, transparent: true, opacity: 0.9, depthTest: false }));
    guide.renderOrder = 996;
    guide.frustumCulled = false;
    guide.visible = false;
    scene.add(guide);
    const guideIn = new THREE.Vector3(), guideOut = new THREE.Vector3();
    function updateGuide() {
      guide.visible = isBankStage() && canThrow() && gazedTarget === bouncer && dartState !== 'flying';
      if (!guide.visible) return;
      const pos = guideGeo.attributes.position;
      guideIn.copy(gazePoint).sub(dart.position).normalize();
      bankRedirect(guideIn, gazePoint, guideOut);
      const end = gazePoint.clone().addScaledVector(guideOut, gazePoint.distanceTo(bankTarget.position));
      pos.setXYZ(0, dart.position.x, dart.position.y, dart.position.z);
      pos.setXYZ(1, gazePoint.x, gazePoint.y, gazePoint.z);
      pos.setXYZ(2, end.x, end.y, end.z);
      pos.needsUpdate = true;
      guide.computeLineDistances();
    }

    // ----- Target chain -----
    const CHAIN_SPOTS = [[1.7, 0.25, -0.6], [1.9, -0.1, 0.05], [1.7, 0.3, 0.65]];
    function setFaded(t, faded) {
      t.traverse(o => {
        if (o.isMesh && o.material && !o.userData.isStuckDart && !o.userData.isGlow) {
          o.material.transparent = true;
          o.material.opacity = faded ? 0.25 : 1;
        }
      });
    }
    function highlightChain() {
      chainTargets.forEach(t => {
        const isNext = t.userData.order === trick.chainNext;
        t.userData.baseScale = isNext ? 0.8 : 0.6;
        setFaded(t, t.userData.order < trick.chainNext);
      });
    }
    function resetChain(k) {
      if (k === undefined) k = readHeading();
      clearStuckDarts();
      trick.chainNext = 0;
      trick.chainTime = CHAIN_TIME;
      // Shuffle which spot each number goes to
      const spots = CHAIN_SPOTS.slice().sort(() => Math.random() - 0.5);
      chainTargets.forEach((t, i) => placeRelative(t, spots[i][0] * k, spots[i][1], spots[i][2]));
      highlightChain();
    }

    // ----- Scoring for each throw in trick mode -----
    function trickThrow(points, hitTarget) {
      trick.darts++;
      const stage = trick.stage;
      const where = hitTarget ? hitTarget.position.clone().add(new THREE.Vector3(0, 0.3, 0)) : null;

      if (stage === 0) {
        if (points > 0 && hitTarget === tinyTarget) {
          trick.hits++; trick.streak++;
          const combo = (trick.streak - 1) * 25;
          trick.score += points + combo;
          if (combo > 0) showPopup('COMBO x' + trick.streak + '  +' + combo, '#ff3b6b', where);
        } else {
          trick.streak = 0;
        }
      } else if (stage === 1) {
        if (points > 0 && hitTarget === bankTarget) {
          if (bankBounced) {
            trick.hits++;
            trick.score += points + 50;
            showPopup('BANK SHOT! +50', '#4fd8ff', where);
          } else {
            showPopup('NO BOUNCE - USE THE PANEL', '#ffffff', where);
          }
        }
      } else if (stage === 2 && !trick.chainDone) {
        if (hitTarget && hitTarget.userData.type === 'chain' && hitTarget.userData.order === trick.chainNext) {
          trick.chainNext++;
          if (trick.chainNext === 3) {
            trick.chainDone = true;
            const bonus = Math.ceil(trick.chainTime) * 10;
            trick.score = 300 + bonus;
            trick.hits = 3;
            showPopup('CHAIN COMPLETE! +' + (300 + bonus), '#39ff88', where);
            sfxFanfare();
          } else {
            highlightChain();
          }
        } else {
          showPopup('CHAIN RESET - TRY AGAIN', '#ffd23f', where || dart.position);
          setTimeout(() => { if (game.mode === 'trick' && trick.stage === 2 && !trick.chainDone) resetChain(); }, 600);
          trick.chainNext = 0;
        }
      }
      drawHud();

      const t = TRICKS[stage];
      const done = (stage === 2 ? trick.chainDone : trick.hits >= t.goal) || trick.darts >= t.limit;
      if (done) {
        trick.results[stage] = { score: trick.score, hits: trick.hits, done: trick.hits >= t.goal };
        game.waiting = true;
        setTimeout(() => {
          trick.stage++;
          showMenu(trick.stage < 3 ? 'trickIntro' : 'trickResults');
        }, 1600);
      }
    }

    function drawTrickResults() {
      const r = trick.results;
      const total = r.reduce((sum, x) => sum + (x ? x.score : 0), 0);
      drawMenu('TRICK SHOTS DONE!', [
        'Tiny Target: ' + r[0].score + ' pts (' + r[0].hits + '/3 hits)',
        'Bank Shot: ' + r[1].score + ' pts (' + r[1].hits + '/2 hits)',
        'Target Chain: ' + (r[2].done ? r[2].score + ' pts' : 'not finished'),
        'TRICK TOTAL: ' + total
      ], [{ text: 'PLAY AGAIN', action: 'startRound' }, { text: 'TRICK SHOTS', action: 'startTrick' }]);
    }

    function drawTrickHud() {
      const c = hud.ctx;
      const t = TRICKS[trick.stage];
      c.clearRect(0, 0, 1000, 200);
      roundRect(c, 10, 10, 980, 180, 40);
      c.fillStyle = 'rgba(11, 15, 26, 0.7)'; c.fill();
      c.textBaseline = 'middle'; c.textAlign = 'left';
      c.fillStyle = '#ffd23f'; c.font = 'bold 46px Arial';
      c.fillText(t.name, 40, 70);
      c.textAlign = 'right'; c.fillStyle = '#ffffff'; c.font = '42px Arial';
      const info = trick.stage === 2
        ? 'Next: ' + Math.min(trick.chainNext + 1, 3) + '   ' + Math.ceil(trick.chainTime) + 's'
        : 'Hits ' + trick.hits + ' / ' + t.goal;
      c.fillText(info, 960, 70);
      // Bar: darts used out of the limit
      const total = t.limit, gap = 6, w = (920 - gap * (total - 1)) / total;
      for (let i = 0; i < total; i++) {
        c.fillStyle = i < trick.darts ? '#ffd23f' : 'rgba(255,255,255,0.25)';
        roundRect(c, 40 + i * (w + gap), 125, w, 36, 8);
        c.fill();
      }
      hud.texture.needsUpdate = true;
    }

    // Runs every frame
    let hudTimer = 0;
    function updateTrick(dt) {
      // Tiny target slides quickly
      const u = tinyTarget.userData;
      if (tinyTarget.visible && u.home) {
        u.phase += dt * (1.6 + 0.6 * Math.sin(targetTime * 0.7));
        tinyTarget.position.copy(u.home).addScaledVector(sideDir, Math.sin(u.phase) * 0.45);
      }

      // Chain timer
      if (game.mode === 'trick' && trick.stage === 2 && !trick.chainDone && !game.waiting) {
        trick.chainTime -= dt;
        if (trick.chainTime <= 0) {
          showPopup("TIME'S UP - TRY AGAIN", '#ffd23f', chainTargets[1].position.clone().add(new THREE.Vector3(0, 0.3, 0)));
          resetChain();
        }
        hudTimer += dt;
        if (hudTimer > 0.25) { hudTimer = 0; drawHud(); }
      }

      updateGuide();
    }

    // ---------- STAGE 9: SOUND, SETTINGS, PAUSE + POLISH ----------
    // ----- Settings (remembered on this headset) -----
    const DISTANCES = [
      { name: 'NEAR', scale: 0.8 },
      { name: 'NORMAL', scale: 1.0 },
      { name: 'FAR', scale: 1.25 }
    ];
    const settings = { sound: true, music: true, distanceIndex: 1 };
    try {
      const saved = JSON.parse(localStorage.getItem('realityDartsSettings') || '{}');
      Object.assign(settings, saved);
    } catch (e) { /* storage not available: use defaults */ }
    function saveSettings() {
      try { localStorage.setItem('realityDartsSettings', JSON.stringify(settings)); } catch (e) {}
    }

    // ----- Pause button: small world button, low on your left -----
    const pausePlane = makeCanvasPlane(0.17, 0.07, 340, 140);
    const pauseButton = pausePlane.mesh;
    pauseButton.userData.action = 'pause';
    pauseButton.visible = false;
    scene.add(pauseButton);
    (() => {
      const c = pausePlane.ctx;
      roundRect(c, 4, 4, 332, 132, 60);
      c.fillStyle = 'rgba(11, 15, 26, 0.8)'; c.fill();
      c.lineWidth = 6; c.strokeStyle = '#ffffff'; c.stroke();
      c.fillStyle = '#ffffff'; c.font = 'bold 54px Arial';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('II  PAUSE', 170, 72);
      pausePlane.texture.needsUpdate = true;
    })();
    function placePauseButton() {
      camera.getWorldPosition(eyePos);
      pauseButton.position.copy(eyePos).addScaledVector(flatDir, 0.9).addScaledVector(sideDir, -0.42);
      pauseButton.position.y = eyePos.y - 0.4;
      pauseButton.lookAt(eyePos);
    }

    let lastPlay = 'round';       // what RESTART / RESUME go back to
    let settingsReturn = 'intro'; // where BACK goes from settings
    let pausedTargets = [];

    // Returns true if the button was a pause/settings action (handled here)
    function handleMenuAction(action) {
      if (action === 'pause') {
        pausedTargets = activeTargets;
        showMenu('pause');
        return true;
      }
      if (action === 'resume') {
        hideMenu();
        game.mode = lastPlay === 'trick' ? 'trick' : lastPlay;
        drawHud();
        return true;
      }
      if (action === 'restart') {
        hideMenu();
        if (lastPlay === 'practice') startPractice();
        else if (lastPlay === 'trick') trickGo();
        else startRound();
        return true;
      }
      if (action === 'howto') { showMenu('howto'); return true; }
      if (action === 'settings') {
        settingsReturn = game.mode === 'pause' ? 'pause' : 'intro';
        showMenu('settings');
        return true;
      }
      if (action === 'back') {
        showMenu(game.mode === 'howto' ? 'pause' : settingsReturn);
        return true;
      }
      if (action === 'toggleSound') { settings.sound = !settings.sound; applyAudioSettings(); saveSettings(); showMenu('settings'); return true; }
      if (action === 'toggleMusic') { settings.music = !settings.music; applyAudioSettings(); saveSettings(); showMenu('settings'); return true; }
      if (action === 'cycleDistance') {
        settings.distanceIndex = (settings.distanceIndex + 1) % DISTANCES.length;
        saveSettings(); showMenu('settings');
        return true;
      }
      return false;
    }

    // ----- Sound: every sound is made by code, so there are no copyright worries -----
    const audio = { ctx: null, sfx: null, music: null, noise: null, chordTimer: null };
    function initAudio() {
      try {
        if (!audio.ctx) {
          audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const master = audio.ctx.createGain();
          master.connect(audio.ctx.destination);
          audio.sfx = audio.ctx.createGain(); audio.sfx.connect(master);
          audio.music = audio.ctx.createGain(); audio.music.connect(master);
          // One second of white noise, reused for whooshes and thuds
          const len = audio.ctx.sampleRate;
          audio.noise = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
          const data = audio.noise.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
          startMusic();
        }
        audio.ctx.resume();
        applyAudioSettings();
      } catch (e) { console.warn('Sound not available', e); }
    }
    // The browser only allows sound after a click, so we switch it on at the first click
    document.addEventListener('click', initAudio, true);

    function applyAudioSettings() {
      if (!audio.ctx) return;
      const now = audio.ctx.currentTime;
      audio.sfx.gain.setTargetAtTime(settings.sound ? 0.8 : 0, now, 0.05);
      audio.music.gain.setTargetAtTime(settings.sound && settings.music ? 0.12 : 0, now, 0.3);
    }

    // A single beep: frequency, length (s), wave shape, volume, delay, optional slide to another pitch
    function tone(freq, dur, type, vol, delay = 0, slideTo = 0) {
      if (!audio.ctx || !settings.sound) return;
      const t = audio.ctx.currentTime + delay;
      const osc = audio.ctx.createOscillator();
      const g = audio.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(audio.sfx);
      osc.start(t); osc.stop(t + dur + 0.05);
    }

    // A burst of filtered noise (whoosh / thud)
    function noiseBurst(dur, vol, filterType, freqFrom, freqTo) {
      if (!audio.ctx || !settings.sound) return;
      const t = audio.ctx.currentTime;
      const src = audio.ctx.createBufferSource();
      src.buffer = audio.noise;
      const f = audio.ctx.createBiquadFilter();
      f.type = filterType; f.Q.value = 1.2;
      f.frequency.setValueAtTime(freqFrom, t);
      f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
      const g = audio.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(audio.sfx);
      src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
    }

    function sfxThrow()  { noiseBurst(0.22, 0.35, 'bandpass', 700, 2600); }
    function sfxThud()   { tone(150, 0.14, 'sine', 0.6, 0, 70); noiseBurst(0.06, 0.25, 'lowpass', 2000, 400); }
    function sfxMiss()   { tone(330, 0.3, 'triangle', 0.2, 0, 160); }
    function sfxBounce() { tone(1100, 0.1, 'square', 0.08, 0, 1800); }
    function sfxClick()  { tone(880, 0.06, 'sine', 0.25); }
    function sfxHit(points) {
      sfxThud();
      // Higher score = brighter chime
      const notes = points >= 150 ? [784, 988, 1175, 1568]
                  : points >= 100 ? [880, 1320, 1760]
                  : points >= 50  ? [660, 990]
                  : [520];
      notes.forEach((n, i) => tone(n, 0.35, 'triangle', 0.18, 0.05 + i * 0.07));
    }
    function sfxFanfare() {
      [523, 659, 784, 1047].forEach((n, i) => tone(n, 0.4, 'triangle', 0.2, i * 0.1));
    }

    // Calm background music: slow, soft chords that change every 6 seconds
    const CHORDS = [
      [261.6, 329.6, 392.0, 493.9],  // C major 7
      [220.0, 261.6, 329.6, 392.0],  // A minor 7
      [174.6, 220.0, 261.6, 329.6],  // F major 7
      [196.0, 246.9, 293.7, 392.0]   // G
    ];
    let chordIndex = 0;
    function playChord() {
      if (!audio.ctx || audio.ctx.state !== 'running') return;
      const t = audio.ctx.currentTime;
      const filter = audio.ctx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 900;
      filter.connect(audio.music);
      CHORDS[chordIndex].forEach(freq => {
        [0, 4].forEach(detune => {   // two slightly different oscillators = warm sound
          const osc = audio.ctx.createOscillator();
          const g = audio.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          osc.detune.value = detune;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 2);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 7);
          osc.connect(g); g.connect(filter);
          osc.start(t); osc.stop(t + 7.1);
        });
      });
      chordIndex = (chordIndex + 1) % CHORDS.length;
    }
    function startMusic() {
      playChord();
      audio.chordTimer = setInterval(playChord, 6000);
    }

    // ----- Hit sparkles: a small burst of glowing dots -----
    const BURST_DOTS = 24;
    const dotTexture = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 32;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
      return new THREE.CanvasTexture(c);
    })();
    const bursts = [];
    for (let b = 0; b < 6; b++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(BURST_DOTS * 3), 3));
      const points = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.03, map: dotTexture, transparent: true, depthWrite: false, opacity: 0 }));
      points.frustumCulled = false;
      points.visible = false;
      scene.add(points);
      bursts.push({ points, vel: new Float32Array(BURST_DOTS * 3), age: 99 });
    }
    let nextBurst = 0;
    function spawnBurst(pos, color) {
      const b = bursts[nextBurst];
      nextBurst = (nextBurst + 1) % bursts.length;
      const p = b.points.geometry.attributes.position.array;
      for (let i = 0; i < BURST_DOTS; i++) {
        p[i * 3] = pos.x; p[i * 3 + 1] = pos.y; p[i * 3 + 2] = pos.z;
        // random direction, random speed
        const theta = Math.random() * Math.PI * 2, phi = Math.acos(Math.random() * 2 - 1);
        const speed = 0.4 + Math.random() * 0.8;
        b.vel[i * 3] = Math.sin(phi) * Math.cos(theta) * speed;
        b.vel[i * 3 + 1] = Math.abs(Math.cos(phi)) * speed;
        b.vel[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;
      }
      b.points.geometry.attributes.position.needsUpdate = true;
      b.points.material.color.set(color);
      b.points.visible = true;
      b.age = 0;
    }
    function updateBursts(dt) {
      bursts.forEach(b => {
        if (b.age > 0.7) { b.points.visible = false; return; }
        b.age += dt;
        const p = b.points.geometry.attributes.position.array;
        for (let i = 0; i < BURST_DOTS; i++) {
          b.vel[i * 3 + 1] -= 1.5 * dt;   // a little gravity
          p[i * 3] += b.vel[i * 3] * dt;
          p[i * 3 + 1] += b.vel[i * 3 + 1] * dt;
          p[i * 3 + 2] += b.vel[i * 3 + 2] * dt;
        }
        b.points.geometry.attributes.position.needsUpdate = true;
        b.points.material.opacity = Math.max(0, 1 - b.age / 0.7);
      });
    }

    // ---------- WINDOW RESIZE ----------
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- GAME LOOP (runs every frame) ----------
    const clock = new THREE.Clock();
    // Add ?fps to the link to see frames per second on the score bar (goal: 60+)
    const SHOW_FPS = URL_FLAGS.has('fps');
    let fpsFrames = 0, fpsTime = 0;
    renderer.setAnimationLoop((time, frame) => {
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.05); // seconds since last frame
      if (SHOW_FPS) {
        fpsFrames++; fpsTime += rawDt;
        if (fpsTime >= 1) {
          const fps = Math.round(fpsFrames / fpsTime);
          fpsFrames = 0; fpsTime = 0;
          if (hud.mesh.visible) {
            drawHud();
            const c = hud.ctx;
            c.fillStyle = fps >= 60 ? '#39ff88' : '#ff3b6b';
            c.font = 'bold 36px Arial'; c.textAlign = 'center';
            c.fillText(fps + ' FPS', 500, 70);
            hud.texture.needsUpdate = true;
          }
        }
      }
      scanPlanes(frame);
      updateTargets(dt);
      updateTrick(dt);
      styleHands();
      updateGaze();
      updateUI();
      updateDart(dt);
      updatePopups(dt);
      updateWobbles(dt);
      updateBursts(dt);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
