<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Darts</title>
  <style>
    body { margin: 0; background: #0b0f1a; color: white; font-family: Arial, sans-serif; overflow: hidden; }
    #info { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; }
    #info h1 { color: #ff3b6b; margin: 0; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <h1>🎯 Reality Darts</h1>
    <p>Press START AR to begin</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    // ---------- STAGE 1: SCENE + PASSTHROUGH ----------
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
    camera.position.set(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    document.body.appendChild(ARButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking', 'plane-detection']
    }));

    renderer.xr.addEventListener('sessionstart', () => {
      document.getElementById('info').style.display = 'none';
    });

    function makeTarget() {
      const target = new THREE.Group();
      const rings = [
        { radius: 0.25, color: 0x2f7bff },
        { radius: 0.15, color: 0xffd23f },
        { radius: 0.06, color: 0xff2d55 }
      ];
      rings.forEach((ring, i) => {
        const mesh = new THREE.Mesh(
          new THREE.CircleGeometry(ring.radius, 48),
          new THREE.MeshBasicMaterial({ color: ring.color })
        );
        mesh.position.z = i * 0.002;
        target.add(mesh);
      });
      return target;
    }

    const target = makeTarget();
    target.position.set(0, 1.2, -1.5);
    scene.add(target);

    // ---------- STAGE 2: GAZE ----------
    const target2 = makeTarget();
    target2.position.set(-0.8, 1.0, -1.6);
    scene.add(target2);

    const targets = [target, target2];
    let gazedTarget = null;

    const gazeDot = new THREE.Mesh(
      new THREE.RingGeometry(0.008, 0.013, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true })
    );
    gazeDot.position.set(0, 0, -1);
    gazeDot.renderOrder = 999;
    gazeDot.onBeforeRender = () => gazeDot.updateMatrixWorld();
    camera.add(gazeDot);
    scene.add(camera);

    const raycaster = new THREE.Raycaster();
    const eyePos = new THREE.Vector3();
    const eyeDir = new THREE.Vector3();
    const bigSize = new THREE.Vector3(1.12, 1.12, 1.12);
    const normalSize = new THREE.Vector3(1, 1, 1);

    function updateGaze() {
      camera.getWorldPosition(eyePos);
      camera.getWorldDirection(eyeDir);
      raycaster.set(eyePos, eyeDir);

      const hits = raycaster.intersectObjects(targets, true);
      let found = null;
      if (hits.length > 0) {
        found = hits[0].object;
        while (found.parent && !targets.includes(found)) found = found.parent;
      }
      gazedTarget = found;

      targets.forEach(t => {
        t.scale.lerp(t === gazedTarget ? bigSize : normalSize, 0.15);
      });

      gazeDot.material.color.set(gazedTarget ? 0x39ff88 : 0xffffff);
    }

    // ---------- WINDOW RESIZE ----------
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- GAME LOOP (runs every frame) ----------
    renderer.setAnimationLoop(() => {
      updateGaze();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
